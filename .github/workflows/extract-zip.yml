# .github/workflows/extract-zip.yml
# Extracts CYMOR-KUCCPS-CourseChecker.zip (at the repo root) and commits the files to the repo.
name: Extract zip

on:
  push:
    branches: [main]
    paths: ['CYMOR-KUCCPS-CourseChecker.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          mkdir _extract
          unzip -q CYMOR-KUCCPS-CourseChecker.zip -d _extract
          SRC="$(find _extract -maxdepth 1 -mindepth 1 -type d | head -n1)"
          rsync -a "$SRC"/ ./
          rm -rf _extract

      - name: Commit extracted files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A . ':!CYMOR-KUCCPS-CourseChecker.zip'
          git diff --cached --quiet || { git commit -m "chore: extract zip [skip ci]"; git push; }
